<!DOCTYPE html>
<html>
<head>
    <title>Contact us</title>
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body>
    <header>
        <h1>Travel Explorer</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="destinations.html">Destinations</a>
            <a href="hotels.html">Hotels</a>
            <a href="gallery.html">Gallery</a>
            <a href="about.html">About Team</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <h1>Contact Us</h1>
        <p>Have a question or wantto know about our travel recommendations? Send us a message and we will be happy to help </p>
        <h2>Send Us a Message </h2>
        <form>
            <label for="name">Name: </label>
            <input type="text" id="name" name="name:">
            <label for="email">Email: </label>
            <input type="email" id="email" name="email">

            <label for="topic">What can we help you with?</label>
            <select id="topic" name="topic">
                <option value="destinations">Destinations</option>
                <option value="hotels">Hotels</option>
                <option value="Travel-trips">Travel-trips</option>
                <option value="other">Other</option>
            </select>

            <label for="message">Message: </label>
            <textarea id="message" name="message" row="5" cols="40"></textarea>
            <button type="submit">Send Message</button>
        </form>
    </main>
    <br><br>
    <footer>
        <p>Created by Zhibek, Albina, Aruzhan</p>
        <p>&copy; 2026 Travel Explorer</p>
    </footer>
</body>
</html>
